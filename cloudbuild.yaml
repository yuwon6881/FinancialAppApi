steps:
  # Build the image and push it. Do not persist intermediate build layers in Artifact
  # Registry: the SDK/ReadyToRun cache is much larger than the runtime image and would
  # by itself exceed Artifact Registry's free storage allowance.
  # $PROJECT_ID/$COMMIT_SHA are Cloud Build substitutions; $$IMAGE is escaped so bash
  # (not Cloud Build) expands it.
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - '-c'
      - |
        set -euo pipefail
        IMAGE="asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/financialapp-api"
        docker build \
          -t "$$IMAGE:$COMMIT_SHA" \
          -t "$$IMAGE:latest" \
          -f FinancialAppApi/Dockerfile .
        docker push "$$IMAGE:latest"
        docker push "$$IMAGE:$COMMIT_SHA"
    id: BuildPush

  # Apply EF Core migrations + seed by running the ALREADY-BUILT image as a one-shot
  # job, so the project is compiled exactly once (in BuildPush). `--migrate` tells the
  # app to apply pending migrations and exit; `--seed-database` seeds idempotently.
  # No shell/entrypoint override is needed: the image's default entrypoint is
  # `dotnet FinancialAppApi.dll`, and Program.cs rewrites the pooler port to session
  # mode (6543 -> 5432) internally when --migrate is set -- which is why the runtime
  # image can now be chiseled (shell-free).
  - name: 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/financialapp-api:$COMMIT_SHA'
    dir: '/app'
    args:
      - '--migrate'
      - '--seed-database'
    secretEnv:
      - 'ConnectionStrings__DefaultConnection'
    id: Migrate
    waitFor:
      - BuildPush

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'financialapp-api'
      - '--image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/financialapp-api:$COMMIT_SHA'
      - '--region=asia-southeast1'
      - '--platform=managed'
      - '--memory=1Gi'
      # Pinned on every deploy (not just the first) so scale-to-zero, request-based
      # billing stays the free-tier guarantee regardless of what a previous manual
      # `gcloud run deploy` may have left the service at.
      - '--min-instances=0'
      - '--max-instances=2'
      # Both are the current defaults for a 1Gi container, pinned for the same reason
      # as the instance bounds: a stray manual deploy must not be able to drift them.
      # --cpu=2 would double billed CPU-seconds; a LOWER --concurrency costs MORE, not
      # less, because fewer requests per instance means more billed instance-seconds.
      - '--cpu=1'
      - '--concurrency=80'
      # Startup CPU boost only bills during instance startup under request-based
      # billing, so it stays free-tier eligible while cutting cold-start latency.
      - '--cpu-boost'
      # CloudTasks__* switches ReceiptScanTaskDispatcher from the in-process queue
      # (which CPU throttling can stall after the 202 response) to a Cloud Tasks HTTP
      # callback, so OCR work always runs inside a billed request. All four keys plus
      # OcrWorkerKey must be non-empty or the dispatcher silently keeps the fallback.
      - '--update-env-vars=Database__MigrateOnStartup=false,Database__SeedOnStartup=false,SupabaseStorage__ProjectUrl=${_SUPABASE_PROJECT_URL},CloudTasks__ProjectId=$PROJECT_ID,CloudTasks__LocationId=asia-southeast1,CloudTasks__QueueId=receipt-scan,CloudTasks__WorkerBaseUrl=https://financialapp-api-i47taxhzba-as.a.run.app,Fcm__ProjectId=$PROJECT_ID,Push__OidcAudience=https://financialapp-api-i47taxhzba-as.a.run.app/api/push/dispatch,Push__AllowlistedServiceAccounts__0=financialapp-scheduler@$PROJECT_ID.iam.gserviceaccount.com,DocumentVault__Bucket=${_DOCUMENT_VAULT_BUCKET}'
      - '--remove-secrets=AiApiKey'
      - '--update-secrets=OcrWorkerKey=financialapp-ocr-worker-key:latest,SupabaseStorage__ApiKey=financialapp-supabase-api-key:latest,MarketData__Providers__TwelveData__ApiKey=financialapp-twelvedata-api-key:latest,OpenAiApiKey=financialapp-openai-api-key:latest'
    id: Deploy
    waitFor:
      - Migrate

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    # Injected directly as the config key the app reads (ConnectionStrings:DefaultConnection),
    # so the migrate step needs no shell to rename it. The secret targets the transaction
    # pooler (port 6543); Program.cs swaps it to session mode (5432) under --migrate.
    - versionName: projects/$PROJECT_ID/secrets/financialapp-db/versions/latest
      env: 'ConnectionStrings__DefaultConnection'

# Non-sensitive deployment configuration. Keeping this as a substitution makes
# the normal Cloud Run environment value explicit and overridable per project.
substitutions:
  _SUPABASE_PROJECT_URL: 'https://wdbdsnpldtiwsmscwyqt.supabase.co'
  _DOCUMENT_VAULT_BUCKET: 'financialapp-vault-396431756440'
