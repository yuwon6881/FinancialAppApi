steps:
  # Build the container image from the nested project directory
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/financialapp-api:$COMMIT_SHA'
      - '-f'
      - 'FinancialAppApi/Dockerfile'   # Dockerfile path relative to repo root
      - 'FinancialAppApi'              # Build context: the subfolder containing the .csproj
    id: Build

  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/financialapp-api:$COMMIT_SHA'
    id: Push

  # Apply EF Core migrations before the new revision is deployed.
  - name: 'mcr.microsoft.com/dotnet/sdk:10.0'
    entrypoint: bash
    secretEnv:
      - 'DB_CONNECTION'
    args:
      - '-c'
      - |
        set -euo pipefail
        export PATH="$PATH:/root/.dotnet/tools"
        export ConnectionStrings__DefaultConnection="$DB_CONNECTION"
        cd FinancialAppApi
        dotnet tool install --global dotnet-ef --version 10.0.8
        dotnet ef database update
    id: Migrate
    waitFor:
      - Push

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'financialapp-api'
      - '--image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/financialapp-api:$COMMIT_SHA'
      - '--region=asia-southeast1'
      - '--platform=managed'
      - '--update-env-vars=Database__MigrateOnStartup=false'
    id: Deploy
    waitFor:
      - Migrate

images:
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/financialapp-api:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/financialapp-db/versions/latest
      env: 'DB_CONNECTION'
