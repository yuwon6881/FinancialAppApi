steps:
  # Build the image from the nested project dir and push it -- one step, so the
  # image is compiled and pushed without a separate push step or an end-of-build
  # re-push from the images: block. $PROJECT_ID/$COMMIT_SHA are Cloud Build
  # substitutions; $$IMAGE is escaped so bash (not Cloud Build) expands it.
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        IMAGE="asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/financialapp-api:$COMMIT_SHA"
        docker build -t "$$IMAGE" -f FinancialAppApi/Dockerfile FinancialAppApi
        docker push "$$IMAGE"
    id: BuildPush

  # Apply EF Core migrations + seed by running the ALREADY-BUILT image, so the
  # project is compiled exactly once (in the Docker Build step above). The app
  # applies pending migrations via Database.Migrate() when MigrateOnStartup is
  # set, and --seed-database seeds idempotently then exits without serving.
  - name: 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/financialapp-api:$COMMIT_SHA'
    entrypoint: bash
    env:
      - 'Database__MigrateOnStartup=true'
    secretEnv:
      - 'DB_CONNECTION'
    args:
      - '-c'
      - |
        set -euo pipefail
        # The runtime secret targets the transaction pooler (port 6543), but EF Core
        # migrations take a session-scoped advisory lock that transaction pooling drops
        # between statements -- so run migrations against session mode (port 5432).
        export ConnectionStrings__DefaultConnection="$${DB_CONNECTION/Port=6543/Port=5432}"
        cd /app
        dotnet FinancialAppApi.dll --seed-database
    id: Migrate
    waitFor:
      - BuildPush

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'financialapp-api'
      - '--image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/financialapp-api:$COMMIT_SHA'
      - '--region=asia-southeast1'
      - '--platform=managed'
      - '--memory=1Gi'
      - '--update-env-vars=Database__MigrateOnStartup=false,Database__SeedOnStartup=false'
    id: Deploy
    waitFor:
      - Migrate

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/financialapp-db/versions/latest
      env: 'DB_CONNECTION'
